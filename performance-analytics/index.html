<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance Analytics · AdtreeGO</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f8a3b'/%3E%3Ccircle cx='13' cy='12' r='5' fill='white'/%3E%3Cpath d='M4 27c1-5 4.5-8 9-8s8 3 9 8' fill='white'/%3E%3Cpath d='M24 8v8M20 12h8' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design notes (why):
   - Dark by default to match the team's own CRM mind map; a light theme is one click away.
   - The four group colors from that map (Growth, Operations, Revenue, Base) are the only accents.
   - Work-tool density: 13px text, KPI strips instead of one big card per number, tight tables,
     so a whole module fits on one screen. Every creator or merchant row opens its full profile. */
:root{--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--r-lg:12px;--r-md:9px;--r-sm:7px}
:root[data-theme="dark"]{
  --bg:#0a0c10;--side:#0d1015;--panel:#12151c;--panel2:#191d26;--hover:#1f2430;--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
  --text:#e9ecf2;--muted:#8a92a5;--faint:#5a6275;
  --growth:#34c759;--ops:#ff9f0a;--rev:#ff6961;--base:#4da3ff;--good:#34c759;--warn:#ff9f0a;--bad:#ff6961;
  --tint:.15;--shadow:none;color-scheme:dark}
:root[data-theme="light"]{
  --bg:#f6f7f9;--side:#ffffff;--panel:#ffffff;--panel2:#f1f3f6;--hover:#e9ecf1;--line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.14);
  --text:#161a22;--muted:#626a7b;--faint:#a0a6b3;
  --growth:#1f8a3b;--ops:#b35c00;--rev:#cc2f26;--base:#0066d6;--good:#1f8a3b;--warn:#b35c00;--bad:#cc2f26;
  --tint:.1;--shadow:0 1px 2px rgba(16,24,40,.04);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 var(--font);font-feature-settings:"cv11","ss01";color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;border-radius:var(--r-sm);padding:6px 10px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;min-width:0;height:30px}
textarea{height:auto}
select{cursor:pointer}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--base);box-shadow:0 0 0 3px color-mix(in srgb,var(--base) 22%,transparent)}
:focus-visible{outline:2px solid var(--base);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);font-weight:500;height:30px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--base);border-color:var(--base);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn.tag.on{background:color-mix(in srgb,var(--ops) calc(var(--tint)*100%),transparent);border-color:var(--ops);color:var(--ops)}

aside{width:236px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:9px;padding:14px 14px 4px;font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.demo{margin:8px 14px 4px;font-size:11px;color:var(--ops);background:color-mix(in srgb,var(--ops) calc(var(--tint)*100%),transparent);border-radius:6px;padding:4px 8px}
.navscroll{flex:1;overflow:auto;padding:2px 8px 12px}
.navgroup{margin-top:12px}
.navgroup-title{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 8px 4px}
.navgroup-title i{width:6px;height:6px;border-radius:50%}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:5px 8px;border-radius:7px;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.navitem:hover{background:var(--hover);color:var(--text)}
.navitem.on{background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);color:var(--text)}
.navitem.on span:first-child{color:var(--c)}
.navitem .chev{margin-left:auto;display:inline-flex;color:var(--faint);transition:transform .15s}
.navmod.open > .navitem .chev{transform:rotate(90deg)}
.subnav{display:flex;flex-direction:column;gap:1px;margin:1px 0 6px 16px;padding-left:9px;border-left:1px solid var(--line2)}
.subitem{text-align:left;padding:4px 8px;font-size:12.5px;color:var(--muted);border-radius:6px;position:relative}
.subitem:hover{color:var(--text);background:var(--hover)}
.subitem.on{color:var(--text);font-weight:600;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent)}
.subitem.on::before{content:"";position:absolute;left:-10px;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--c)}
.chartbox{width:100%;position:relative;overflow:hidden}
.chartbox svg{display:block;position:absolute;inset:0}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.side-foot label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

.wrap{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 20px;height:50px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);position:sticky;top:0;z-index:10}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.crumbs b{color:var(--text);font-weight:600}
.spacer{flex:1}
.search{position:relative;width:230px}
#scope{font-size:11px;color:var(--muted)}#scope b{color:var(--text);font-weight:550}
#indf button.on{color:var(--text)}
.search input{width:100%;padding-left:30px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--font);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(0,0,0,.28);padding:4px;z-index:30;max-height:340px;overflow:auto}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:7px 9px}
.results button:hover{background:var(--hover)}
.results span:last-child{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
main{flex:1;overflow:auto;padding:0 20px 48px}
.page{max-width:1640px;margin:0 auto;padding-top:16px}

.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 12px}
.ph-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);color:var(--c);flex-shrink:0}
h1{font-size:19px;line-height:1.2;letter-spacing:-.02em;margin:0;font-weight:650}
.sub{color:var(--muted);margin:1px 0 0;font-size:12.5px}
.scope{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 9px;white-space:nowrap}
.scope b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:2px;margin:0 0 16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{white-space:nowrap;padding:8px 11px;border-radius:0;font-weight:500;color:var(--muted);font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--c,var(--text))}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(6,minmax(0,1fr))}.g3>*{grid-column:span 2}.g3>:nth-child(3n+1):last-child{grid-column:span 6}.g3>:nth-child(3n+1):nth-last-child(2),.g3>:nth-child(3n+2):last-child{grid-column:span 3}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
/* Cards in one row share a height; the chart or list inside grows to use it, so no empty band under a short card. */
.card > .viz,.card > .chartbox{flex:1}
.viz{display:flex;flex-direction:column}
.viz > .chartbox{flex:1}
.card > .hbars,.card > .funnel{flex:1;justify-content:space-evenly}
.card > .donut-wrap{flex:1;justify-content:center}
.card > .stack{flex:1}
.card > .timeline{flex:1;justify-content:space-between}
.fillv{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.donut-wrap.stack{flex-direction:column;align-items:stretch;justify-content:space-evenly;flex-wrap:nowrap}
.donut-wrap.stack > div:first-child{align-self:center}
.card{container-type:inline-size}
@container (max-width:460px){.donut-wrap:not(.stack){flex-wrap:nowrap;gap:14px}.donut-wrap svg{width:118px;height:118px}.donut-list{min-width:0;gap:4px}.donut-list div{font-size:12px}}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:24px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:13px;font-weight:600}
.card-h p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:12px}
/* KPI strip: any grid of KPIs becomes one bordered bar with hairline dividers */
.grid:has(> .kpi){display:flex;flex-wrap:wrap;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.grid:has(> .kpi) > .kpi{flex:1 1 128px;min-width:0}
.grid:has(> .kpi:nth-child(8)) > .kpi{flex-basis:22%}
.grid:has(> .kpi:nth-child(9)) > .kpi{flex-basis:18%}
.kpi{display:flex;flex-direction:column;gap:2px;border:none;border-radius:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);padding:12px 14px;position:relative;container-type:inline-size}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3}
.card .kpi .l{white-space:normal}
.kpi .v{font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kpi .spark{position:absolute;top:14px;right:14px;width:36%;max-width:120px;height:30px;opacity:.9}
.kpi:has(.spark) .l{padding-right:38%}
@container (max-width:150px){.kpi .spark{display:none}.kpi:has(.spark) .l{padding-right:0}}
.delta{font-weight:600;font-size:11px;border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) calc(var(--tint)*100%),transparent)}
.delta.down{color:var(--bad);background:color-mix(in srgb,var(--bad) calc(var(--tint)*100%),transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;border-radius:5px;padding:1px 7px;white-space:nowrap;color:var(--tc,var(--muted));background:color-mix(in srgb,var(--tc,var(--muted)) calc(var(--tint)*100%),transparent)}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor}

.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools .count{font-size:11.5px;color:var(--muted);margin-left:auto}
.tbl{overflow:auto;margin:0 -16px -14px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;font-weight:550;color:var(--muted);text-align:left;padding:7px 10px;white-space:nowrap;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
th.sort{cursor:pointer}th.sort:hover{color:var(--text)}
td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap;height:38px}
tbody tr:first-child td{border-top:none}
th:first-child,td:first-child{padding-left:16px}th:last-child,td:last-child{padding-right:16px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:color-mix(in srgb,var(--hover) 55%,transparent)}
tr.open{cursor:pointer}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.ava{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.who small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:7px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.tspark{width:84px;height:22px;display:block}

.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(84px,150px) 1fr auto;gap:12px;align-items:center;font-size:12.5px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.track{position:relative;height:12px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--base)) 11%,var(--panel2))}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--base)) 70%,transparent),var(--c,var(--base)))}
.goal{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--panel)}
.hbar .vl{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:60px}
.hbar .vl small{color:var(--muted);font-weight:500}
.meter{height:5px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:50px}
.meter span{display:block;height:100%;border-radius:99px;background:var(--c,var(--base))}
.mrow{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px}
svg text{font-family:var(--font)}
.chart{width:100%;display:block}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-list{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.donut-list div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.donut-list i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.donut-list .dl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-list b{white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.days td{padding:3px 1px;text-align:center;height:auto}
.days td:first-child{text-align:left;padding-left:16px;padding-right:10px;position:sticky;left:0;background:var(--panel);z-index:1}
.days th{text-align:center;padding:6px 1px;font-size:10.5px}
.days th:first-child{text-align:left}
.dot{display:inline-block;width:15px;height:15px;border-radius:4px;background:var(--panel2);vertical-align:middle}
.dot.p{background:color-mix(in srgb,var(--base) 55%,transparent)}.dot.s{background:var(--good)}.dot.l{background:color-mix(in srgb,#bf5af2 65%,transparent)}.dot.x{background:color-mix(in srgb,var(--bad) 55%,transparent)}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:84px 1fr 110px;gap:10px;align-items:center;font-size:12.5px}
.fbar{height:30px;border-radius:7px;background:color-mix(in srgb,var(--c,var(--base)) 26%,transparent);border-left:3px solid var(--c,var(--base));display:flex;align-items:center;padding-left:9px;font-weight:600;font-variant-numeric:tabular-nums;min-width:44px}
.fstep .rate{color:var(--muted);font-size:11.5px;text-align:right}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label,.field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
.form .wide{grid-column:1/-1}
.range{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center}
.range input{padding:0;height:auto;accent-color:var(--c,var(--base));background:none;border:none;box-shadow:none}
.range b{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:650;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums}
.status-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.status-row:first-child{border-top:none}
.status-row .grow{flex:1;min-width:0}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{background:var(--panel2);border-radius:var(--r-md);padding:8px}
.col h4{margin:2px 4px 8px;font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.task{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:6px;display:flex;flex-direction:column;gap:6px}
.task b{font-size:12.5px;font-weight:600}
.task .row{display:flex;align-items:center;gap:8px}
.preview{aspect-ratio:16/9;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);text-align:center}
.pulse{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 38%;gap:12px;align-items:end;box-shadow:var(--shadow);transition:border-color .15s}
.tile-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-p{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.tile-x .muted{text-align:right;margin-bottom:5px}
.tile:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.tile-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--c);margin-bottom:4px}
.tile-v{font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile-l{font-size:12px}.tile-s{font-size:11.5px;color:var(--muted)}
.tile-x{min-width:0}
.section-t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.task-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.task-row:first-child{border-top:none}.task-row .grow{flex:1;min-width:0}
.tick{width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0}
.tick:hover{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,transparent)}
.link{padding:0;color:var(--base);font-size:11.5px}.link:hover{text-decoration:underline}
.bench{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:7px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.bench b{font-size:11px;color:var(--faint);font-weight:600}
.fresh{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--good)}

.tgt-preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:13px}
.form .form{min-width:0}
.form input[type=date]{width:100%;min-width:0}
.link.cnt{font-size:13px;font-weight:600}
.check-line{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-size:12.5px;color:var(--text)!important}
.check-line input{width:auto;height:auto}
.tot-row td{font-weight:650;background:var(--panel2)}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2);min-width:120px}
.mix i{display:block;height:100%}
.signals{display:flex;flex-direction:column}
.signal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.signal:first-child{border-top:none}
.signal>i{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.dot-c{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.heatmap td,.heatmap th{text-align:center}
.heatmap td:first-child{text-align:left;font-weight:600}
code.small{font-size:11px;white-space:normal;word-break:break-word;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tkpi{text-align:left;border:1px solid var(--line)!important;border-radius:var(--r-lg)!important;box-shadow:var(--shadow)!important;gap:4px!important;cursor:pointer;background:var(--panel)}
.tkpi.on{border-color:var(--base)!important;background:color-mix(in srgb,var(--base) 8%,var(--panel))}
.tkpi .meter{margin-top:2px}
.tstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstat div{border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--c) 12%,transparent);display:flex;flex-direction:column}
.tstat b{font-size:22px;color:var(--c)}
.tstat span{font-size:11.5px;color:var(--muted)}
.mtx th,.mtx td{white-space:nowrap}
.mcell,.xcell,.hcell{display:inline-flex;flex-direction:column;align-items:flex-end;min-width:64px;padding:4px 8px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums}
.mcell{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.mcell small,.xcell small{font-size:10.5px;font-weight:500;color:var(--muted)}
.hcell{background:color-mix(in srgb,var(--ops) var(--p),transparent)}
.hcell.diag{outline:1.5px solid var(--ops)}
.xbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.xsel{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:500}
.xpre{border:1px solid var(--line);cursor:pointer;background:var(--panel2)}
.xpre.on{border-color:var(--base);color:var(--base)}
.tedit input{width:90px;text-align:right}
.mixrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:12.5px}
.tsum{cursor:pointer}
.tsum:hover{background:var(--hover)}
@media (max-width:1100px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mixrow{grid-template-columns:100px 1fr}}
.simrow{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
.simrow input{width:100%;height:auto;padding:0}
.simrow b{text-align:right;font-variant-numeric:tabular-nums}
.wrow{display:grid;grid-template-columns:190px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
.wbar{position:relative;height:10px;border-radius:99px;background:var(--panel2)}
.wbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.wbar i{position:absolute;top:0;bottom:0;border-radius:99px}
.wrow b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.simrow{grid-template-columns:110px 1fr 44px}.wrow{grid-template-columns:120px 1fr 44px}}
.fgroup{flex-wrap:wrap}
.crumbs{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.as-chip{white-space:normal}.date-in{width:118px}}

// Level moves inside the selected month, from the level log (up, down, joined).
function levelMoves(P, keep) {
  const s0 = P.m.s, all = stats(P.a, P.b).filter(keep), moves = [];
  for (const s of all) for (const [d, l] of s.c.hist.slice(1)) if (d >= s0 && d <= P.b) { const before = levelAt(s.c, d - 1); moves.push({s, d, from: before, to: l, up: LV.indexOf(l) > LV.indexOf(before)}); }
  const pm = stats(P.pm.s, P.pm.s + P.pm.n - 1);
  const rows = LV.filter(l => !ui.f.lvl || l === ui.f.lvl).map(l => ({l, start: all.filter(s => s.c.join < s0 && levelAt(s.c, s0) === l).length, upOut: moves.filter(x => x.from === l && x.up).length, downOut: moves.filter(x => x.from === l && !x.up).length,
    inn: moves.filter(x => x.to === l).length, joined: all.filter(s => s.c.join >= s0 && s.c.join <= P.b && s.c.hist[0][1] === l).length, end: all.filter(s => s.lvl === l).length}));
  return card(`Level moves in ${P.m.label}`, 'From the level log: levels change on the 2nd of the month based on last month’s GMV.', h('div', {class: 'stack'},
    h('div', {class: 'tbl lvl'}, h('table', {}, h('thead', {}, h('tr', {}, ['Level', 'Start of month', 'Moved up', 'Moved down', 'Came in', 'Joined', 'Now'].map((x, i) => h('th', {class: i ? 'n' : ''}, x)))),
      h('tbody', {}, rows.map(r => h('tr', {}, h('td', {}, levelChip(r.l)), h('td', {class: 'n'}, N(r.start)), h('td', {class: 'n', style: 'color:var(--growth)'}, r.upOut ? '↑ ' + N(r.upOut) : '0'), h('td', {class: 'n', style: 'color:var(--rev)'}, r.downOut ? '↓ ' + N(r.downOut) : '0'),
        h('td', {class: 'n'}, N(r.inn)), h('td', {class: 'n'}, N(r.joined)), h('td', {class: 'n'}, h('b', {}, N(r.end)))))))),
    table([{k: 'h', label: 'Creator', render: x => person(x.s.c.handle, x.s.c.city)}, {k: 'mv', label: 'Move', render: x => h('span', {}, levelChip(x.from), x.up ? ' ↑ ' : ' ↓ ', levelChip(x.to))}, {k: 'd', label: 'Day', num: true, fmt: dLab},
      {k: 'g', label: `GMV in ${P.pm.k}`, num: true, fmt: Rp}], moves.map(x => ({...x, h: x.s.c.handle, mv: x.to, g: pm[x.s.c.i].gmv, _open: () => openCreator(x.s.c.i)})), {sortKey: 'g', pageSize: 6, search: false})));
}

      LV.map((l, i) => { const x = out.filter(y => y.s.lvl === l), inUp = out.filter(y => LV[i - 1] && y.s.lvl === LV[i - 1]), inDown = out.filter(y => LV[i + 1] && y.s.lvl === LV[i + 1]);
        return {l, n: x.length, up: x.filter(y => y.up >= 0.5).length, eu: sum(x, y => y.up), down: x.filter(y => y.down >= 0.5).length, ed: sum(x, y => y.down), net: Math.round(x.length - sum(x, y => y.up + y.down) + sum(inUp, y => y.up) + sum(inDown, y => y.down))}; }).filter(r => r.n), {search: false, pageSize: 6}))),
    h('div', {class: Math.abs(ups.length - downs.length) > 3 ? 'stack mt' : 'grid g2 mt'}, card(`Likely to move up · ${N(ups.length)}`, 'Keep them going: they are close to the next level.', table([{k: 'h', label: 'Creator', render: x => person(x.s.c.handle, x.s.c.city)}, {k: 'mv', label: 'Move', render: x => h('span', {}, levelChip(x.s.lvl), ' ↑ ', levelChip(x.next))},
        {k: 'mu', label: 'Month forecast', num: true, fmt: Rp}, {k: 'up', label: 'Chance', num: true, render: x => chanceChip(x.up)}], ups.map(x => ({...x, h: x.s.c.handle, mv: x.next, _open: () => openCreator(x.s.c.i)})), {search: false, sortKey: 'up', pageSize: 8})),

};

// ================= Unusual Days =================
// A day is unusual when it is far from what the same weekday of the 4 weeks before suggests (robust z-score on median and MAD, 2.5 or more).
PAGES['Unusual Days'] = () => {
  const P = period(), sk = ui.tab.uds || 'all', S = stats(P.m.s, P.b).filter(dsKeep), stSel = STREAMS.find(st => st.k === sk);
  const fOf = st => st ? sdf('gmv', st) : (c, d) => gmvDay(c, d), list = st => st ? S.filter(s => inStream(s, st)) : S;
  const scan = st => { const y = daily(list(st), 0, LAST, fOf(st)), out = [];
    for (let d = P.m.s; d <= P.b; d++) { const win = []; for (let w = d - 28; w < d; w++) if (w >= 0 && wday(w) === wday(d)) win.push(y[w]); const all28 = []; for (let w = d - 28; w < d; w++) if (w >= 0) all28.push(y[w]);
      const exp = median(win), mad = median(all28.map(v => Math.abs(v - median(all28)))) * 1.4826 || 1, z = (y[d] - exp) / mad;
      out.push({d, y: y[d], exp, z, flag: Math.abs(z) >= 2.5, st}); }
    return {y, out}; };
  const groups = (stSel ? [stSel] : STREAMS).map(st => scan(st)), main = scan(stSel), flags = groups.flatMap(g => g.out.filter(x => x.flag));
  const why = x => { const lst = list(x.st), f = fOf(x.st); let best = null, bv = 0; for (const s of lst) { const v = f(s.c, x.d); if (Math.abs(v) > Math.abs(bv)) { bv = v; best = s; } } return best ? {s: best, v: bv} : null; };
  return [h('div', {class: 'tools'}, seg([['all', 'All'], ...STREAMS.map(st => [st.k, st.label])], sk, v => { ui.tab.uds = v; render(); }, 'Industry · format'), h('span', {class: 'spacer'}), h('span', {class: 'muted small'}, 'Robust z-score against the same weekday of the 4 weeks before.')),
    h('div', {class: 'grid'}, kpi('Unusual days', N(flags.length), {sub: `${P.m.label}, up to ${dLab(P.b)}`, c: flags.length ? '--ops' : '--growth'}), kpi('Spikes', N(flags.filter(x => x.z > 0).length), {c: '--growth'}), kpi('Drops', N(flags.filter(x => x.z < 0).length), {c: '--rev'})),
    row(card(`Redemption GMV by day · ${stSel ? stSel.label : 'all'}`, 'Bar = actual, tick = expected for that weekday. Coloured bars = unusual.', columns(main.out.map(x => ({label: String(x.d - P.m.s + 1), value: x.y, target: x.exp, c: x.flag ? (x.z > 0 ? '--growth' : '--rev') : '--muted'})), {fmt: short, height: 230}))),
    row(card('Unusual days found', 'Biggest single creator that day, to see where to look first.', flags.length ? table([{k: 'd', label: 'Day', fmt: (v) => `${WD[wday(v)]} ${dLab(v)}`}, {k: 'stl', label: 'Industry · format'},
      {k: 'y', label: 'Actual', num: true, fmt: Rp}, {k: 'exp', label: 'Expected', num: true, fmt: Rp}, {k: 'chg', label: 'Difference', num: true, render: r => chip(pctS(r.chg), r.z > 0 ? '--growth' : '--rev', false)}, {k: 'z', label: 'Score', num: true, fmt: v => v.toFixed(1)},
      {k: 'who', label: 'Biggest creator that day', render: r => r.w ? h('span', {class: 'small'}, `${r.w.s.c.handle} · ${short(r.w.v)} (${pct(r.w.v, r.y)}%)`) : '-'}],
      flags.map(x => { const w = why(x); return {...x, stl: x.st ? x.st.label : 'All', chg: x.exp ? x.y / x.exp - 1 : 0, w, _open: w ? () => openCreator(w.s.c.i) : null}; }), {search: false, sortKey: 'd', pageSize: 10}) : h('div', {class: 'muted small'}, 'No unusual days in these dates.')))];
};

// ================= profiles =================
function openCreator(i) {

      h('div', {class: 'timeline', style: 'margin-top:8px'}, [...c.hist].reverse().map(([d, l], k, arr) => h('div', {class: 'ev', style: `--c:var(${LVC[l]})`}, h('i'), h('div', {}, k === arr.length - 1 ? `Started at ${l}` : `Moved to ${l}`, h('small', {}, k === arr.length - 1 ? 'first level we have' : 'level log')), h('time', {}, d ? dLab(d) : 'Before Aug'))))),
    sec('Where they sell (video)', table([{k: 'name', label: 'Place', render: r => person(r.m.name, `${r.m.city}${r.m.promoted ? ' · promoted' : ''}`)}, {k: 'w', label: 'Share', num: true, fmt: v => Math.round(v * 100) + '%'}, {k: 'np', label: 'New posts', num: true, fmt: v => v.toFixed(1)}, {k: 'g', label: 'GMV', num: true, fmt: Rp}],
      links.map(r => ({...r, name: r.m.name, _open: () => openMerchant(r.m.i)})), {search: false, sortKey: 'g', pageSize: 6})),
    rooms.length ? sec('Last LIVE sessions', table([{k: 'd', label: 'Day', render: r => `${dLab(r.d)} · ${r.hr}:00`}, {k: 'b', label: 'Brand', render: r => D.brands[r.b].name}, {k: 'dur', label: 'Minutes', num: true}, {k: 'vw', label: 'Viewers', num: true, fmt: N}, {k: 'gr', label: 'GMV', num: true, fmt: Rp}], rooms, {search: false, pageSize: 8})) : null,
    sec('Content quality', props([['Avg duration', c.cq.dur + ' s'], ['Completion', c.cq.comp.toFixed(1) + '%'], ['Like rate', c.cq.like.toFixed(1) + '%'], ['Comment rate', c.cq.com.toFixed(2) + '%'], ['Last new post', ago(s.last, P.b)], ['Industry', c.ind]]))],
  [h('span', {class: 'muted small'}, `${P.label} vs ${P.plabel} · sample creator`)]);
}
function openMerchant(i) {

// ================= shell =================
const GROUPS = [['Overview', '--growth', ['Overview', 'Target Achievement']], ['Creator', '--base', ['Creator · Video', 'Creator · LIVE']], ['Merchant', '--ops', ['Merchant · Video', 'Merchant · LIVE']], ['Breakdown', '--rev', ['Area & Origin', 'Explorer']], ['Data science', '--base', ['Forecast', 'Drivers & Levers', 'Creator Outlook', 'Unusual Days']], ['Guide', '--muted', ['Metric guide']]];
const PAGES_ALL = GROUPS.flatMap(g => g[2]);
function rangeBox(fg) {
  const P = period(), iso = d => `2026-${String(MONTHS.indexOf(P.m) + 8).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const day = (k2, label) => h('input', {type: 'date', class: 'date-in', min: iso(1), max: iso(P.n), value: iso(k2 === 'd0' ? P.d0 : P.d1), 'aria-label': label, onchange: e => {

    const n = {...ui.range, k: 'custom', [k2]: Math.min(+v.slice(8), P.n)}; if (n.d0 > n.d1) [n.d0, n.d1] = [n.d1, n.d0]; ui.range = n; render(); }});
  return [fg('Month', h('select', {'aria-label': 'Month', onchange: e => { ui.month = e.target.value; setRange('mtd'); render(); }}, MONTHS.slice(1).map(m => h('option', {value: m.k, selected: m.k === ui.month}, m.k === 'Nov' ? `${m.label} (to ${dLab(LAST)})` : m.label)))),
    fg('Dates', h('select', {'aria-label': 'Date range', onchange: e => { setRange(e.target.value); render(); }}, [...RANGES.filter(([k2]) => k2 !== 'month' || P.n === P.m.n), ['custom', 'Custom']].map(([k2, l]) => h('option', {value: k2, selected: ui.range.k === k2, disabled: k2 === 'custom'}, l))), day('d0', 'From'), h('span', {class: 'muted small'}, 'to'), day('d1', 'To')),
    h('span', {class: 'muted small'}, `vs ${P.plabel}`)];
}
function render() {

  if (!PAGES_ALL.includes(ui.page)) ui.page = 'Overview';

  put($('#as'), h('span', {class: 'as-chip'}, 'Data to ', h('b', {}, `${dLab(LAST)} 2026`), ' · loaded daily from TikTok exports'));

    fg('Area', h('select', {'aria-label': 'Area', onchange: e => { ui.f.area = e.target.value; render(); }}, h('option', {value: ''}, 'All areas'),
      [['Region', 'r', REGIONS], ['Province', 'p', PROVINCES], ['City', 'c', CITIES]].map(([l, t, list]) => h('optgroup', {label: l}, list.map(v => h('option', {value: `${t}:${v}`, selected: ui.f.area === `${t}:${v}`}, v)))))));
  const y = $('main').scrollTop; put($('#page'), PAGES[ui.page]()); $('main').scrollTop = y;
}
$('#theme').onclick = () => { ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; render(); };
